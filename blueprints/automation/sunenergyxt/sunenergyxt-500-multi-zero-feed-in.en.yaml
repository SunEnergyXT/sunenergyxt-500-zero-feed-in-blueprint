          default: ""
          selector:
            entity:
              domain: input_boolean
        d3_low_hold:
          name: Device 3 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d4_full_hold:
          name: Device 4 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d4_low_hold:
          name: Device 4 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d5_full_hold:
          name: Device 5 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d5_low_hold:
          name: Device 5 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d6_full_hold:
          name: Device 6 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d6_low_hold:
          name: Device 6 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d7_full_hold:
          name: Device 7 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d7_low_hold:

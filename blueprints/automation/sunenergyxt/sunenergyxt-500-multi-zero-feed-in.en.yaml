blueprint:
  name: SunEnergyXT 500 Series - Multi-Space Zero Feed-In
  description: >
    Coordinated zero-feed-in control for up to nine SunEnergyXT 500 / 500 Pro devices using a Home Assistant meter. Device 1 is required; devices 2 to 9 are optional.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  source_url: https://github.com/SunEnergyXT/sunenergyxt-500-zero-feed-in-blueprint/blob/main/blueprints/automation/sunenergyxt/sunenergyxt-500-multi-zero-feed-in.en.yaml
  input:
    devices:
      name: SunEnergyXT Devices
      icon: mdi:devices
      description: >
        Select up to nine SunEnergyXT devices. Device 1 is required; devices 2 to 9 are optional.
      input:
        aio_device_1:
          name: Device 1
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_2:
          name: Device 2 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_3:
          name: Device 3 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_4:
          name: Device 4 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_5:
          name: Device 5 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_6:
          name: Device 6 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_7:
          name: Device 7 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_8:
          name: Device 8 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        aio_device_9:
          name: Device 9 (optional)
          default: ""
          selector:
            device:
              filter:
                - integration: sunenergyxt
        full_battery_mode:
          name: Full battery behavior
          default: follow_load
          selector:
            select:
              options:
                - label: Follow load after full charge
                  value: follow_load
                - label: Follow PV after full charge
                  value: follow_pv
        min_discharge_soc:
          name: System discharge limit
          default: 10
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "%"
              mode: box
        max_charge_soc:
          name: System charge limit
          default: 100
          selector:
            number:
              min: 70
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box
        soc_hysteresis_percent:
          name: SOC hysteresis
          default: 5
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "%"
              mode: box
        total_max_grid_output_w:
          name: Maximum total grid output
          default: 21600
          selector:
            number:
              min: 0
              max: 21600
              step: 1
              unit_of_measurement: W
              mode: box
        ac_couple_max_charge_power_w:
          name: Maximum AC-coupled charge power per device
          default: 2400
          selector:
            number:
              min: 0
              max: 2400
              step: 1
              unit_of_measurement: W
              mode: box
    soc_hold_helpers:
      name: Optional SOC hold helpers
      icon: mdi:battery-sync-outline
      collapsed: true
      input:
        d1_full_hold:
          name: Device 1 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d1_low_hold:
          name: Device 1 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d2_full_hold:
          name: Device 2 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d2_low_hold:
          name: Device 2 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d3_full_hold:

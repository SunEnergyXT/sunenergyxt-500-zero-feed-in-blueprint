          dict(active=d8_active, low=d8_low, bypass=d8_bypass, lp=d8_lp_w, pv=d8_pv_w, gp=d8_gp_w, gs=d8_current_gs_w, inverter=d8_current_is_w, cap=d8_output_cap_w, grid_cap=d8_grid_cap_w, weight=d8_discharge_weight_w, full=d8_full, charge_cap=d8_charge_potential_w, charge_weight=d8_charge_weight_w),

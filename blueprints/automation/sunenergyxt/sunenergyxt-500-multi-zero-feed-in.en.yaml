             and states(meter_l2_import_entity | trim) not in bad_states
             and states(meter_l3_import_entity | trim) not in bad_states
             and states(meter_l1_export_entity | trim) not in bad_states
             and states(meter_l2_export_entity | trim) not in bad_states
             and states(meter_l3_export_entity | trim) not in bad_states
             and is_number(states(meter_l1_import_entity | trim))
             and is_number(states(meter_l2_import_entity | trim))
             and is_number(states(meter_l3_import_entity | trim))
             and is_number(states(meter_l1_export_entity | trim))
             and is_number(states(meter_l2_export_entity | trim))
             and is_number(states(meter_l3_export_entity | trim)) }}
        {% else %}{{ false }}{% endif %}

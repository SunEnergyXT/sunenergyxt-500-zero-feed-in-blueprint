    control:
      name: Control settings
      icon: mdi:cog-outline
      collapsed: true
      input:
        target_grid_power_w:
          name: Household meter target
          default: 0
          selector:
            number:
              min: -200
              max: 200
              step: 1
              unit_of_measurement: W
              mode: box
        target_grid_power_entity:
          name: Optional dynamic target helper
          default: ""
          selector:
            entity:
              domain: number
        soc_weight_percent:
          name: SOC allocation weight
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        gain_percent:
          name: Correction gain
          default: 100
          selector:
            number:
              min: 20
              max: 150
              step: 5
              unit_of_measurement: "%"
              mode: slider
        small_error_w:
          name: Small error threshold
          default: 30
          selector:
            number:
              min: 1
              max: 300
              step: 1
              unit_of_measurement: W
              mode: box
        large_error_w:
          name: Large error threshold
          default: 150
          selector:
            number:
              min: 10
              max: 1000
              step: 10
              unit_of_measurement: W
              mode: box
        slow_interval_s:
          name: Slow write interval
          default: 7
          selector:
            number:
              min: 1
              max: 120
              step: 0.5
              unit_of_measurement: s
              mode: box
        medium_interval_s:
          name: Medium write interval
          default: 2.5
          selector:
            number:
              min: 0.5
              max: 60
              step: 0.5
              unit_of_measurement: s
              mode: box
        fast_interval_s:
          name: Fast write interval
          default: 1
          selector:
            number:
              min: 1
              max: 20
              step: 1
              unit_of_measurement: s
              mode: box
        fast_load_response:
          name: Fast load-step correction (optional)
          description: >-
            Household meter deviation always determines the system response.
            From the large-error threshold, this option applies the configured
            correction gain (at most 100%), up to the total step limit.
            The fast interval remains active at deviations of 10 W or more;
            feedback settle time still applies.
            Enable only when feedback settle time matches actual device and
            meter delays; otherwise overshoot may increase. Disabled by default.
          default: false
          selector:
            boolean:
        load_step_max_w:
          name: Maximum total correction for load changes
          description: >-
            Total budget per control step, not per device. Applies only with
            fast response enabled and a deviation at the large-error threshold
            or above. A smaller limit requires several steps for large loads.
          default: 1500
          selector:
            number:
              min: 50
              max: 7200
              step: 50
              unit_of_measurement: W
              mode: box
        feedback_settle_s:
          name: Feedback settle time
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: s
              mode: box
        max_meter_age_s:
          name: Maximum meter age
          default: 30
          selector:
            number:
              min: 2
              max: 300
              step: 1
              unit_of_measurement: s
              mode: box
        max_step_small_w:
          name: Maximum small correction
          default: 20
          selector:
            number:
              min: 1
              max: 300
              step: 1
              unit_of_measurement: W
              mode: box
        max_step_medium_w:
          name: Maximum medium correction
          default: 120
          selector:
            number:
              min: 10
              max: 1000
              step: 10
              unit_of_measurement: W
              mode: box
        max_step_large_w:
          name: Maximum large correction
          default: 450
          selector:
            number:
              min: 50
              max: 2400
              step: 10
              unit_of_measurement: W
              mode: box
        diagnostic_log_level:
          name: Diagnostic log level
          default: off
          selector:
            select:
              options:
                - label: "Off"
                  value: "off"
                - label: Writes
                  value: write
                - label: Decisions
                  value: decision
                - label: Debug
                  value: debug
        diagnostic_log_interval_s:
          name: Diagnostic log interval
          default: 60
          selector:
            number:
              min: 10
              max: 3600
              step: 10
              unit_of_measurement: s
              mode: box

mode: single
max_exceeded: silent

trigger:
  - platform: time_pattern
    seconds: "/3"

variables:
  aio_device_1: !input aio_device_1
  aio_device_2: !input aio_device_2
  aio_device_3: !input aio_device_3
  aio_device_4: !input aio_device_4
  aio_device_5: !input aio_device_5
  aio_device_6: !input aio_device_6
  aio_device_7: !input aio_device_7
  aio_device_8: !input aio_device_8
  aio_device_9: !input aio_device_9
  pro3em_meter_device: !input pro3em_meter_device
  ecotracker_meter_device: !input ecotracker_meter_device
  bitshake_meter_device: !input bitshake_meter_device
  meter_power_source: !input meter_power_source
  custom_meter_formula: !input custom_meter_formula
  meter_entity_override: !input meter_power_sensor
  meter_power_attribute: !input meter_power_attribute
  meter_l1_device: !input meter_l1_device
  meter_l2_device: !input meter_l2_device
  meter_l3_device: !input meter_l3_device
  meter_l1_entity_override: !input meter_l1_power_sensor
  meter_l2_entity_override: !input meter_l2_power_sensor
  meter_l3_entity_override: !input meter_l3_power_sensor
  meter_import_entity_override: !input meter_import_power_sensor
  meter_export_entity_override: !input meter_export_power_sensor
  meter_l1_import_entity_override: !input meter_l1_import_power_sensor
  meter_l2_import_entity_override: !input meter_l2_import_power_sensor
  meter_l3_import_entity_override: !input meter_l3_import_power_sensor
  meter_l1_export_entity_override: !input meter_l1_export_power_sensor
  meter_l2_export_entity_override: !input meter_l2_export_power_sensor
  meter_l3_export_entity_override: !input meter_l3_export_power_sensor
  meter_sign_mode: !input meter_sign_mode
  meter_power_multiplier: !input meter_power_multiplier
  external_meter_device: >-
    {% set source = meter_power_source | trim %}
    {% if source == 'shelly_total_power' %}{{ pro3em_meter_device | string | trim }}
    {% elif source == 'ecotracker_power' %}{{ ecotracker_meter_device | string | trim }}
    {% elif source == 'bitshake_tasmota_power' %}{{ bitshake_meter_device | string | trim }}
    {% else %}{{ '' }}{% endif %}
  effective_meter_power_source: >-
    {% if meter_power_source | trim == 'custom' %}{{ custom_meter_formula | trim }}{% else %}{{ meter_power_source | trim }}{% endif %}
  meter_entity: >-
    {% set override = meter_entity_override | string | trim %}
    {% if override %}
      {{ override }}
    {% else %}
      {% set ns = namespace(entity='') %}
      {% for entity in (device_entities(external_meter_device) if external_meter_device | string | trim | length > 0 else []) if ns.entity == '' and entity.startswith('sensor.') %}
        {% set name = (state_attr(entity, 'friendly_name') or entity) | lower %}
        {% set eid = entity | lower %}
        {% set unit = (state_attr(entity, 'unit_of_measurement') or '') | lower %}
        {% set dc = (state_attr(entity, 'device_class') or '') | lower %}
        {% set is_power = dc == 'power' or unit in ['w', 'kw'] or 'power' in name or 'leistung' in name %}
        {% set is_phase = ' l1' in name or ' l2' in name or ' l3' in name or '_l1' in eid or '_l2' in eid or '_l3' in eid or 'phase' in name %}
        {% set is_excluded = 'energy' in name or 'voltage' in name or 'current' in name or 'energie' in name or 'spannung' in name or 'strom' in name %}
        {% set is_pair = 'import' in name or 'export' in name or 'returned' in name or 'consumption' in name or 'feed' in name %}
        {% if is_power and not is_phase and not is_pair and not is_excluded %}{% set ns.entity = entity %}{% endif %}
      {% endfor %}
      {% if ns.entity == '' %}
        {% for entity in (device_entities(external_meter_device) if external_meter_device | string | trim | length > 0 else []) if ns.entity == '' and entity.startswith('sensor.') %}
          {% set unit = (state_attr(entity, 'unit_of_measurement') or '') | lower %}{% set dc = (state_attr(entity, 'device_class') or '') | lower %}
          {% if dc == 'power' or unit in ['w', 'kw'] %}{% set ns.entity = entity %}{% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.entity }}
    {% endif %}
  meter_l1_entity: >-
    {% set override = meter_l1_entity_override | string %}{% if override | trim %}{{ override | trim }}{% else %}{% set ns = namespace(entity='') %}{% for entity in (device_entities(meter_l1_device) if meter_l1_device | string | trim | length > 0 else []) if ns.entity == '' and entity.startswith('sensor.') %}{% set name = (state_attr(entity, 'friendly_name') or entity) | lower %}{% set eid = entity | lower %}{% set unit = (state_attr(entity, 'unit_of_measurement') or '') | lower %}{% set dc = (state_attr(entity, 'device_class') or '') | lower %}{% if (dc == 'power' or unit in ['w', 'kw'] or 'power' in name or 'leistung' in name) and ('l1' in name or '_l1' in eid or 'phase a' in name) and not ('energy' in name or 'energie' in name or 'voltage' in name or 'spannung' in name or 'current' in name or 'strom' in name or 'import' in name or 'export' in name) %}{% set ns.entity = entity %}{% endif %}{% endfor %}{{ ns.entity }}{% endif %}
  meter_l2_entity: >-
    {% set override = meter_l2_entity_override | string %}{% if override | trim %}{{ override | trim }}{% else %}{% set ns = namespace(entity='') %}{% for entity in (device_entities(meter_l2_device) if meter_l2_device | string | trim | length > 0 else []) if ns.entity == '' and entity.startswith('sensor.') %}{% set name = (state_attr(entity, 'friendly_name') or entity) | lower %}{% set eid = entity | lower %}{% set unit = (state_attr(entity, 'unit_of_measurement') or '') | lower %}{% set dc = (state_attr(entity, 'device_class') or '') | lower %}{% if (dc == 'power' or unit in ['w', 'kw'] or 'power' in name or 'leistung' in name) and ('l2' in name or '_l2' in eid or 'phase b' in name) and not ('energy' in name or 'energie' in name or 'voltage' in name or 'spannung' in name or 'current' in name or 'strom' in name or 'import' in name or 'export' in name) %}{% set ns.entity = entity %}{% endif %}{% endfor %}{{ ns.entity }}{% endif %}
  meter_l3_entity: >-
    {% set override = meter_l3_entity_override | string %}{% if override | trim %}{{ override | trim }}{% else %}{% set ns = namespace(entity='') %}{% for entity in (device_entities(meter_l3_device) if meter_l3_device | string | trim | length > 0 else []) if ns.entity == '' and entity.startswith('sensor.') %}{% set name = (state_attr(entity, 'friendly_name') or entity) | lower %}{% set eid = entity | lower %}{% set unit = (state_attr(entity, 'unit_of_measurement') or '') | lower %}{% set dc = (state_attr(entity, 'device_class') or '') | lower %}{% if (dc == 'power' or unit in ['w', 'kw'] or 'power' in name or 'leistung' in name) and ('l3' in name or '_l3' in eid or 'phase c' in name) and not ('energy' in name or 'energie' in name or 'voltage' in name or 'spannung' in name or 'current' in name or 'strom' in name or 'import' in name or 'export' in name) %}{% set ns.entity = entity %}{% endif %}{% endfor %}{{ ns.entity }}{% endif %}

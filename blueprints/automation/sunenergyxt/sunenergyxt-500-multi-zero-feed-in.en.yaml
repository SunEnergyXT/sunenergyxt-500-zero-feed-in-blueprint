        meter_l1_export_power_sensor:
          name: Custom L1 export power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_l2_export_power_sensor:
          name: Custom L2 export power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_l3_export_power_sensor:
          name: Custom L3 export power entity
          default: ""
          selector:
            entity:
              domain: sensor

    meter_sign_setup:
      name: Meter sign and unit
      icon: mdi:meter-electric
      collapsed: true
      input:
        meter_sign_mode:
          name: Sign convention
          default: auto_from_preset
          selector:
            select:
              options:
                - label: Automatic by meter type
                  value: auto_from_preset
                - label: Export is positive
                  value: export_positive
                - label: Grid import is positive
                  value: import_positive
        meter_power_multiplier:
          name: Meter power multiplier
          default: 1
          selector:
            number:
              min: 0.001
              max: 1000
              step: 0.001
              mode: box
    entity_overrides:

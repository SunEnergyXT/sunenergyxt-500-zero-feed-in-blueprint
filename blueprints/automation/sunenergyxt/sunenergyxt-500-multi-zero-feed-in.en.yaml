          selector:
            entity:
              domain: input_boolean
        d8_low_hold:
          name: Device 8 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d9_full_hold:
          name: Device 9 full battery hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
        d9_low_hold:
          name: Device 9 low SOC hold helper
          default: ""
          selector:
            entity:
              domain: input_boolean
    meter_setup:
      name: Meter setup
      icon: mdi:meter-electric
      description: >
        Select one meter type and fill in only its matching fields. For a
        Shelly 3EM, the three phase power values are summed.
      input:
        meter_power_source:
          name: Meter type
          description: >
            Select the measurement source. Use the custom section only when
            the standard sources do not match your meter.
          selector:
            select:
              options:
                - label: Shelly Pro 3EM
                  value: shelly_total_power
                - label: EcoTracker
                  value: ecotracker_power
                - label: BitShake / Tasmota
                  value: bitshake_tasmota_power
                - label: Shelly 3EM three-phase sum
                  value: shelly_three_phase_sum
                - label: Custom meter
                  value: custom

    meter_pro3em_setup:
      name: Shelly Pro 3EM meter
      icon: mdi:meter-electric
      collapsed: true
      input:
        pro3em_meter_device:
          name: Shelly Pro 3EM device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor

    meter_ecotracker_setup:
      name: EcoTracker meter
      icon: mdi:meter-electric
      collapsed: true
      input:
        ecotracker_meter_device:
          name: EcoTracker device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor

    meter_bitshake_setup:
      name: BitShake / Tasmota meter
      icon: mdi:meter-electric
      collapsed: true
      input:
        bitshake_meter_device:
          name: BitShake / Tasmota device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor

    meter_shelly3em_setup:
      name: Shelly 3EM meter
      icon: mdi:meter-electric
      collapsed: true
      description: >
        Select the three phase entities or devices. The blueprint adds the
        power values of L1, L2 and L3.
      input:
        meter_l1_device:
          name: Shelly 3EM phase A / L1 device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor
        meter_l2_device:
          name: Shelly 3EM phase B / L2 device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor
        meter_l3_device:
          name: Shelly 3EM phase C / L3 device
          default: ""
          selector:
            device:
              entity:
                - domain: sensor

    meter_custom_setup:
      name: Custom meter
      icon: mdi:meter-electric
      collapsed: true
      input:
        custom_meter_formula:
          name: Custom meter power formula
          default: custom_signed_total_power
          selector:
            select:
              options:
                - label: Signed total power
                  value: custom_signed_total_power
                - label: L1 + L2 + L3
                  value: custom_three_phase_sum
                - label: Export - import
                  value: import_export_pair
                - label: L1-L3 export - import
                  value: custom_three_phase_import_export
                - label: Entity attribute
                  value: ecotracker_attribute_power
        meter_power_sensor:
          name: Custom total power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_power_attribute:
          name: Custom power attribute
          default: power
          selector:
            text:
        meter_l1_power_sensor:
          name: Custom L1 power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_l2_power_sensor:
          name: Custom L2 power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_l3_power_sensor:
          name: Custom L3 power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_import_power_sensor:
          name: Custom import power entity
          default: ""
          selector:
            entity:
              domain: sensor
        meter_export_power_sensor:
